    <!-- Compatibility for Safari / iPadOS 15.x.
         The app's Supabase fetch wrapper uses AbortSignal.timeout(),
         which is not available on Safari/iOS 15.8.x. -->
    <script>
      (function () {
        if (
          window.AbortSignal &&
          !window.AbortSignal.timeout &&
          window.AbortController
        ) {
          window.AbortSignal.timeout = function (milliseconds) {
            var controller = new AbortController();

            window.setTimeout(function () {
              controller.abort();
            }, milliseconds);

            return controller.signal;
          };
        }
      })();
    </script>
